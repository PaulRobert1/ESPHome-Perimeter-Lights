esphome:
  name: perimlighttemp
  friendly_name: perimlighttemp

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
i2c:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    gateway: !secret wifi_manual_ip_gateway
    subnet: !secret wifi_manual_ip_subnet
    static_ip: !secret wifi_manual_ip_static_ip

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret wifi_ap_ssid
    password: !secret wifi_ap_password

captive_portal:

sensor:
  - platform: bmp280_i2c
    temperature:
      name: "Outside Temperature"
      id: OutsideTemp
      oversampling: 16x
      filters:
       - offset: -10
    pressure:
      name: "Atmospheric Pressure"
      id: Pressure
    address: 0x76
    update_interval: 6s
  - platform: adc
    pin: A0
    id: air_particles
    name: "Gas Sensor"
    device_class: ""
    update_interval: 60s
    filters:
      - multiply: 100
    unit_of_measurement: "%"
    icon: "mdi:percent"

text_sensor:
  - platform: template
    name: "SW1"
    id: Light1
  - platform: template
    name: "SW2"
    id: Light2
  - platform: template
    name: "SW3"
    id: Light3

switch:
  - platform: gpio
    pin:
      number: D0
      inverted: False
    id: SW1
    name: "Perimeter Light 1"
    icon: "mdi:restart"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
    - logger.log: "ON"

  - platform: gpio
    pin:
      number: D5
      inverted: False
    id: SW2
    name: "Perimeter Light 2"
    icon: "mdi:restart"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
    - logger.log: "ON"

  - platform: gpio
    pin:
      number: D3
      inverted: False
    id: SW3
    name: "Perimeter Light 3"
    icon: "mdi:restart"
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
    - logger.log: "ON"
